<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="100%" height="100%" style="background: #ffffff; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Soft Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
    
    <!-- Pipe Gradients -->
    <linearGradient id="pipeGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pipeGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pipeGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    
    <!-- Marker Arrows -->
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Header Banner -->
  <rect x="16" y="14" width="688" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="39" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a" letter-spacing="0.5">🌾 FARMER ONBOARDING &amp; DECISION JOURNEY</text>

  <!-- BACKGROUND CONNECTING PIPES (SNAKE PATH) -->
  <!-- Row 1: Rightwards (1 -> 2 -> 3) -->
  <path d="M 125 150 L 595 150" fill="none" stroke="url(#pipeGrad1)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- S-Curve 1: Downwards Turn (3 -> 4) -->
  <path d="M 595 150 C 685 150, 685 340, 595 340" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

  <!-- Row 2: Leftwards (4 -> 5 -> 6) -->
  <path d="M 595 340 L 125 340" fill="none" stroke="url(#pipeGrad2)" stroke-width="4" stroke-linecap="round"/>

  <!-- S-Curve 2: Downwards Turn (6 -> 7) -->
  <path d="M 125 340 C 35 340, 35 530, 125 530" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

  <!-- Row 3: Rightwards (7 -> 8) -->
  <path d="M 125 530 L 460 530" fill="none" stroke="url(#pipeGrad3)" stroke-width="4" stroke-linecap="round"/>

  <!-- ==================== ROW 1 (Left to Right) ==================== -->

  <!-- STEP 1: Vernacular Voice -->
  <g transform="translate(25, 95)" filter="url(#cardShadow)">
    <rect width="200" height="110" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#10b981"/>
    <circle cx="28" cy="30" r="14" fill="#d1fae5"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">🎙️</text>
    <rect x="145" y="16" width="45" height="18" rx="4" fill="#d1fae5"/>
    <text x="167" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#065f46">STEP 1</text>
    <text x="14" y="62" font-size="13" font-weight="700" fill="#0f172a">Vernacular Voice UI</text>
    <text x="14" y="80" font-size="10.5" fill="#475569">Speaks Marathi/Hindi audio</text>
    <text x="14" y="96" font-size="10" font-weight="600" fill="#059669">⚡ Zero typing needed</text>
  </g>

  <!-- STEP 2: GPS Soil -->
  <g transform="translate(260, 95)" filter="url(#cardShadow)">
    <rect width="200" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#059669"/>
    <circle cx="28" cy="30" r="14" fill="#ecfdf5"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">🛰️</text>
    <rect x="145" y="16" width="45" height="18" rx="4" fill="#ecfdf5"/>
    <text x="167" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">STEP 2</text>
    <text x="14" y="62" font-size="13" font-weight="700" fill="#0f172a">Zero-Lab GPS Soil</text>
    <text x="14" y="80" font-size="10.5" fill="#475569">SoilGrids GIS auto-lookup</text>
    <text x="14" y="96" font-size="10" font-weight="600" fill="#047857">📍 pH, Clay &amp; Org C</text>
  </g>

  <!-- STEP 3: Land & Water -->
  <g transform="translate(495, 95)" filter="url(#cardShadow)">
    <rect width="200" height="110" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#0284c7"/>
    <circle cx="28" cy="30" r="14" fill="#e0f2fe"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">💧</text>
    <rect x="145" y="16" width="45" height="18" rx="4" fill="#e0f2fe"/>
    <text x="167" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#0369a1">STEP 3</text>
    <text x="14" y="62" font-size="13" font-weight="700" fill="#0f172a">Land &amp; Water Source</text>
    <text x="14" y="80" font-size="10.5" fill="#475569">Acreage &amp; Canal/Borewell</text>
    <text x="14" y="96" font-size="10" font-weight="600" fill="#0284c7">🚰 Rainfed calibrated</text>
  </g>

  <!-- ==================== ROW 2 (Right to Left) ==================== -->

  <!-- STEP 4: Rotation -->
  <g transform="translate(495, 285)" filter="url(#cardShadow)">
    <rect width="200" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#2563eb"/>
    <circle cx="28" cy="30" r="14" fill="#eff6ff"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">🔄</text>
    <rect x="145" y="16" width="45" height="18" rx="4" fill="#eff6ff"/>
    <text x="167" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">STEP 4</text>
    <text x="14" y="62" font-size="13" font-weight="700" fill="#0f172a">Crop Rotation History</text>
    <text x="14" y="80" font-size="10.5" fill="#475569">Past harvest recorded</text>
    <text x="14" y="96" font-size="10" font-weight="600" fill="#2563eb">🌱 +15% Legume Bonus</text>
  </g>

  <!-- STEP 5: AI Profit Ranking -->
  <g transform="translate(260, 285)" filter="url(#cardShadow)">
    <rect width="200" height="110" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#7c3aed"/>
    <circle cx="28" cy="30" r="14" fill="#f5f3ff"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">🧠</text>
    <rect x="145" y="16" width="45" height="18" rx="4" fill="#f5f3ff"/>
    <text x="167" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#6d28d9">STEP 5</text>
    <text x="14" y="62" font-size="13" font-weight="700" fill="#0f172a">AI Profit Ranking</text>
    <text x="14" y="80" font-size="10.5" fill="#475569">XGBoost ML + CACP A₂+FL</text>
    <text x="14" y="96" font-size="10" font-weight="600" fill="#7c3aed">🏆 Top 3 Ranked Crops</text>
  </g>

  <!-- STEP 6: What-If Sliders -->
  <g transform="translate(25, 285)" filter="url(#cardShadow)">
    <rect width="200" height="110" rx="10" fill="#ffffff" stroke="#c026d3" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#c026d3"/>
    <circle cx="28" cy="30" r="14" fill="#fdf4ff"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">🎛️</text>
    <rect x="145" y="16" width="45" height="18" rx="4" fill="#fdf4ff"/>
    <text x="167" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#a21caf">STEP 6</text>
    <text x="14" y="62" font-size="13" font-weight="700" fill="#0f172a">What-If Risk Sliders</text>
    <text x="14" y="80" font-size="10.5" fill="#475569">Rainfall &amp; Price Shock test</text>
    <text x="14" y="96" font-size="10" font-weight="600" fill="#c026d3">📉 -35% Deficit Stress</text>
  </g>

  <!-- ==================== ROW 3 (Left to Right) ==================== -->

  <!-- STEP 7: Head to Head Comparison -->
  <g transform="translate(25, 475)" filter="url(#cardShadow)">
    <rect width="200" height="110" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#db2777"/>
    <circle cx="28" cy="30" r="14" fill="#fdf2f8"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">🆚</text>
    <rect x="145" y="16" width="45" height="18" rx="4" fill="#fdf2f8"/>
    <text x="167" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#be185d">STEP 7</text>
    <text x="14" y="62" font-size="13" font-weight="700" fill="#0f172a">Head-to-Head 🆚</text>
    <text x="14" y="80" font-size="10.5" fill="#475569">Farmer thought vs AI crop</text>
    <text x="14" y="96" font-size="10" font-weight="600" fill="#db2777">💰 +₹/Acre Profit Delta</text>
  </g>

  <!-- STEP 8: Milestone Calendar & WhatsApp PDF -->
  <g transform="translate(260, 475)" filter="url(#cardShadow)">
    <rect width="435" height="110" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <rect x="0" y="0" width="435" height="6" rx="3" fill="#ea580c"/>
    <circle cx="28" cy="30" r="14" fill="#fff7ed"/>
    <text x="28" y="35" text-anchor="middle" font-size="14">📅</text>
    <rect x="375" y="16" width="48" height="18" rx="4" fill="#fff7ed"/>
    <text x="399" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#c2410c">OUTPUT</text>
    <text x="14" y="62" font-size="14" font-weight="800" fill="#0f172a">Crop Action Plan &amp; 1-Click WhatsApp PDF Slip</text>
    <text x="14" y="80" font-size="11" fill="#475569">Day 0-120 stage-wise advisory, fertilizer checklist &amp; voice guidance</text>
    <text x="14" y="98" font-size="10.5" font-weight="700" fill="#ea580c">📄 Official Vector Slip Export • 📱 Instant WhatsApp Share • 📶 Works 100% Offline</text>
  </g>

  <!-- Bottom Guarantee Banner -->
  <g transform="translate(25, 605)">
    <rect width="670" height="42" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="335" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">✨ Total Journey Time: &lt; 90 Seconds • 100% Vernacular Voice Guidance • Zero Internet Mode</text>
  </g>
</svg>