<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" width="100%" height="100%" style="display: block; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Subtle Card Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Clean Agritech Green Arrow Markers -->
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- ==================== HEADER BAR ==================== -->
  <rect x="16" y="12" width="688" height="34" rx="6" fill="#f4f7f2" stroke="#d8e0d4" stroke-width="1.2"/>
  <text x="360" y="34" text-anchor="middle" font-size="13" font-weight="800" fill="#14532d" letter-spacing="0.6">FASAL-DISHA INTERACTIVE DECISION ECOSYSTEM</text>

  <!-- ==================== STAGE 1: TOP-LEFT (Simple Onboarding) ==================== -->
  <g transform="translate(16, 56)" filter="url(#cardShadow)">
    <rect width="324" height="242" rx="8" fill="#ffffff" stroke="#d8e0d4" stroke-width="1.4"/>
    <path d="M 0 8 Q 0 0 8 0 L 316 0 Q 324 0 324 8 L 324 30 L 0 30 Z" fill="#f4f7f2"/>
    <text x="14" y="20" font-size="11.5" font-weight="800" fill="#14532d">1. SIMPLE ONBOARDING</text>

    <!-- Node 1: Auto-Detect GPS -->
    <g transform="translate(12, 38)">
      <rect width="300" height="52" rx="6" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
      <text x="14" y="22" font-size="11.5" font-weight="800" fill="#181c18">Auto-Detect GPS Location</text>
      <text x="14" y="40" font-size="9.5" font-weight="500" fill="#4b5563">Detects taluka, district &amp; agro-climatic zone</text>
    </g>

    <!-- Arrow down -->
    <line x1="162" y1="90" x2="162" y2="102" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrGreen)"/>

    <!-- Node 2: Regional Language -->
    <g transform="translate(12, 102)">
      <rect width="300" height="52" rx="6" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
      <text x="14" y="22" font-size="11.5" font-weight="800" fill="#181c18">Regional Language Detection</text>
      <text x="14" y="40" font-size="9.5" font-weight="500" fill="#4b5563">Choose or speak to detect a language</text>
    </g>

    <!-- Arrow down -->
    <line x1="162" y1="154" x2="162" y2="166" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrGreen)"/>

    <!-- Node 3: Mobile OTP -->
    <g transform="translate(12, 166)">
      <rect width="300" height="52" rx="6" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
      <text x="14" y="22" font-size="11.5" font-weight="800" fill="#181c18">Mobile Number &amp; OTP Login</text>
      <text x="14" y="40" font-size="9.5" font-weight="500" fill="#4b5563">Quick 1-tap phone verification</text>
    </g>
  </g>

  <!-- Big Arrow: Stage 1 -> Stage 2 -->
  <line x1="178" y1="298" x2="178" y2="346" stroke="#15803d" stroke-width="2.2" marker-end="url(#arrGreen)"/>

  <!-- ==================== STAGE 2: BOTTOM-LEFT (7-Question Farm Profile) ==================== -->
  <g transform="translate(16, 350)" filter="url(#cardShadow)">
    <rect width="324" height="376" rx="8" fill="#ffffff" stroke="#d8e0d4" stroke-width="1.4"/>
    <path d="M 0 8 Q 0 0 8 0 L 316 0 Q 324 0 324 8 L 324 30 L 0 30 Z" fill="#f4f7f2"/>
    <text x="14" y="20" font-size="11.5" font-weight="800" fill="#14532d">2. 7-QUESTION FARM PROFILE</text>
    <rect x="228" y="5" width="84" height="20" rx="4" fill="#ffffff" stroke="#d8e0d4"/>
    <text x="270" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#166534">Voice Enabled</text>

    <!-- 7 Question Chips -->
    <g transform="translate(12, 38)">
      <g transform="translate(0, 0)">
        <rect width="144" height="34" rx="4" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
        <text x="72" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#181c18">Q1. Land Size</text>
      </g>
      <g transform="translate(156, 0)">
        <rect width="144" height="34" rx="4" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
        <text x="72" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#181c18">Q2. Soil Type</text>
      </g>
      <g transform="translate(0, 42)">
        <rect width="144" height="34" rx="4" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
        <text x="72" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#181c18">Q3. Water Source</text>
      </g>
      <g transform="translate(156, 42)">
        <rect width="144" height="34" rx="4" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
        <text x="72" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#181c18">Q4. Last Season Crop</text>
      </g>
      <g transform="translate(0, 84)">
        <rect width="144" height="34" rx="4" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
        <text x="72" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#181c18">Q5. Sowing Date</text>
      </g>
      <g transform="translate(156, 84)">
        <rect width="144" height="34" rx="4" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
        <text x="72" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#181c18">Q6. Owned Equipment</text>
      </g>
      <g transform="translate(0, 126)">
        <rect width="300" height="36" rx="4" fill="#f4f7f2" stroke="#166534" stroke-width="1.3"/>
        <text x="150" y="23" text-anchor="middle" font-size="10.5" font-weight="800" fill="#14532d">Q7. Crops Farmer is Thinking of Sowing</text>
      </g>
    </g>

    <!-- Processing Engine Box inside Stage 2 -->
    <g transform="translate(12, 212)">
      <rect width="300" height="150" rx="6" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
      <rect width="300" height="24" rx="6" fill="#e2e8dc"/>
      <text x="150" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#14532d">DATA &amp; COST PROCESSING ENGINE</text>
      
      <text x="14" y="50" font-size="10" font-weight="600" fill="#374151">• GIS SoilGrids &amp; Historical Weather Data</text>
      <text x="14" y="76" font-size="10" font-weight="600" fill="#374151">• XGBoost ML Yield Prediction Model</text>
      <text x="14" y="102" font-size="10" font-weight="600" fill="#374151">• CACP Itemized Cost of Cultivation (A₂+FL)</text>
      <text x="14" y="128" font-size="10" font-weight="600" fill="#374151">• 5-Year APMC Mandi Price Trends</text>
    </g>
  </g>

  <!-- ==================== CLEAN CONDUIT PIPELINE (Stage 2 -> Stage 3) ==================== -->
  <path d="M 340 550 H 360 Q 364 550 364 542 V 78 Q 364 70 368 70 H 378" fill="none" stroke="#15803d" stroke-width="2.2" marker-end="url(#arrGreen)"/>

  <!-- ==================== STAGE 3: TOP-RIGHT (Simulation & Comparison) ==================== -->
  <g transform="translate(380, 56)" filter="url(#cardShadow)">
    <rect width="324" height="276" rx="8" fill="#ffffff" stroke="#d8e0d4" stroke-width="1.4"/>
    <path d="M 0 8 Q 0 0 8 0 L 316 0 Q 324 0 324 8 L 324 30 L 0 30 Z" fill="#f4f7f2"/>
    <text x="14" y="20" font-size="11.5" font-weight="800" fill="#14532d">3. SIMULATION &amp; COMPARISON</text>

    <!-- Card 1: Side-by-Side Comparison (Fixed text wrapping so nothing gets cut) -->
    <g transform="translate(12, 38)">
      <rect width="300" height="74" rx="6" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
      <text x="14" y="22" font-size="11.5" font-weight="800" fill="#14532d">Side-by-Side Comparison</text>
      <text x="14" y="42" font-size="9.5" font-weight="500" fill="#4b5563">Compares farmer crops vs. top AI recommendations</text>
      <rect x="14" y="48" width="136" height="18" rx="4" fill="#e2e8dc"/>
      <text x="82" y="61" text-anchor="middle" font-size="9" font-weight="800" fill="#15803d">+₹/Acre Profit Delta</text>
    </g>

    <!-- Card 2: What-If Sliders -->
    <g transform="translate(12, 120)">
      <rect width="300" height="96" rx="6" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
      <text x="14" y="20" font-size="11.5" font-weight="800" fill="#14532d">Interactive "What-If" Sliders</text>
      <text x="14" y="40" font-size="9.5" font-weight="500" fill="#4b5563">• Live Rainfall Amount Slider</text>
      <text x="14" y="58" font-size="9.5" font-weight="500" fill="#4b5563">• Mandi Price Shock Sensitivity</text>
      <rect x="14" y="68" width="168" height="20" rx="4" fill="#e2e8dc"/>
      <text x="98" y="82" text-anchor="middle" font-size="9" font-weight="800" fill="#15803d">Instant Profit Recalculation</text>
    </g>

    <!-- Card 3: Finalize Button (Clean, Green Accent) -->
    <g transform="translate(12, 224)">
      <rect width="300" height="40" rx="6" fill="#f4f7f2" stroke="#15803d" stroke-width="1.5"/>
      <text x="150" y="25" text-anchor="middle" font-size="11.5" font-weight="800" fill="#14532d">Finalize &amp; Save Crop Plan</text>
    </g>
  </g>

  <!-- Big Arrow: Stage 3 -> Stage 4 -->
  <line x1="542" y1="332" x2="542" y2="384" stroke="#15803d" stroke-width="2.2" marker-end="url(#arrGreen)"/>

  <!-- ==================== STAGE 4: BOTTOM-RIGHT (Execution Hub) ==================== -->
  <g transform="translate(380, 388)" filter="url(#cardShadow)">
    <rect width="324" height="338" rx="8" fill="#ffffff" stroke="#d8e0d4" stroke-width="1.4"/>
    <path d="M 0 8 Q 0 0 8 0 L 316 0 Q 324 0 324 8 L 324 30 L 0 30 Z" fill="#f4f7f2"/>
    <text x="14" y="20" font-size="11.5" font-weight="800" fill="#14532d">4. "MERI FASAL" ACTION HUB</text>

    <!-- Delivery 1: Milestones Calendar -->
    <g transform="translate(12, 38)">
      <rect width="300" height="130" rx="6" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
      <text x="14" y="24" font-size="11.5" font-weight="800" fill="#14532d">Seasonal Action Calendar</text>
      <text x="14" y="48" font-size="9.5" font-weight="600" fill="#374151">• Crop-dependent sowing and growth timeline</text>
      <text x="14" y="72" font-size="9.5" font-weight="600" fill="#374151">• Exact dates for NPK fertilizer &amp; watering</text>
      <text x="14" y="96" font-size="9.5" font-weight="600" fill="#374151">• Pest alerts with spoken voice reminders</text>
      <text x="14" y="118" font-size="9" font-weight="700" fill="#15803d">✓ Tailored to farmer's district and sowing date</text>
    </g>

    <!-- Delivery 2: WhatsApp PDF Export -->
    <g transform="translate(12, 178)">
      <rect width="300" height="144" rx="6" fill="#fbfdfa" stroke="#d8e0d4" stroke-width="1.1"/>
      <text x="14" y="24" font-size="11.5" font-weight="800" fill="#14532d">1-Click WhatsApp &amp; PDF Slip</text>
      <text x="14" y="48" font-size="9.5" font-weight="600" fill="#374151">• Clear 1-page printable crop advisory slip</text>
      <text x="14" y="72" font-size="9.5" font-weight="600" fill="#374151">• Instant WhatsApp share with family &amp; KVK officers</text>
      <text x="14" y="96" font-size="9.5" font-weight="600" fill="#374151">• Complete offline access in field</text>
      <text x="14" y="122" font-size="9" font-weight="700" fill="#15803d">✓ Instant WhatsApp Share</text>
    </g>
  </g>
</svg>