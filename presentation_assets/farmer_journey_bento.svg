      <text x="14" y="62" font-size="9.5" font-weight="700" fill="#0f172a">• XGBoost Yield ML Regressor</text>
      <text x="14" y="80" font-size="9.5" font-weight="700" fill="#0f172a">• CACP A₂+FL Local Input Cost Engine</text>
      <text x="14" y="98" font-size="9.5" font-weight="700" fill="#0f172a">• AgMarknet 5-Yr APMC Mandi Price Sync</text>
