      <text x="14" y="28" font-size="12" font-weight="800" fill="#047857">✅ Finalize &amp; Lock Crop Strategy</text>
      <text x="14" y="50" font-size="10" font-weight="600" fill="#059669">1-Tap Confirmed Crop Choice deploys active plan</text>
