      <text x="14" y="24" font-size="11.5" font-weight="800" fill="#86198f">📊 Crop Comparison (Top 3 vs Thought)</text>
      <text x="14" y="44" font-size="9.5" fill="#475569">Ranks AI optimal crops against baseline</text>
      <rect x="14" y="54" width="140" height="20" rx="4" fill="#dcfce7"/>
      <text x="84" y="68" text-anchor="middle" font-size="9.5" font-weight="800" fill="#15803d">+₹/Acre Profit Delta</text>
    </g>

    <!-- Interactive Re-Simulation Loop (Bidirectional Flow) -->
    <g transform="translate(14, 138)">
      <rect width="302" height="106" rx="8" fill="#ffffff" stroke="#c026d3" stroke-width="1.5"/>
      <text x="14" y="24" font-size="11.5" font-weight="800" fill="#86198f">🎛️ Interactive What-If Sliders</text>
      <text x="14" y="44" font-size="9.5" fill="#475569">• Live Rainfall Deficit Slider (-35% to +25%)</text>
      <text x="14" y="62" font-size="9.5" fill="#475569">• APMC Market Shock Sensitivity</text>
      <rect x="14" y="74" width="170" height="20" rx="4" fill="#ffedd5"/>
      <text x="99" y="88" text-anchor="middle" font-size="9.5" font-weight="800" fill="#c2410c">🔄 Dynamic Live Recalculation</text>
    </g>

