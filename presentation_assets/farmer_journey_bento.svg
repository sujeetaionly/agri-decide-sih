  <!-- Arrow Q3 to Q4 (Vertical Drop) -->
  <line x1="539" y1="406" x2="539" y2="422" stroke="#ea580c" stroke-width="3" marker-end="url(#arrOrange)"/>

  <!-- ==================== QUADRANT 4: BOTTOM-RIGHT (Active Advisory & Distribution) ==================== -->
  <g transform="translate(374, 424)" filter="url(#cardShadow)">
    <rect width="330" height="336" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/>
    <!-- Stage Header -->
    <rect width="330" height="34" rx="12" fill="#ffedd5"/>
    <rect y="22" width="330" height="12" fill="#ffedd5"/>
    <text x="16" y="22" font-size="12" font-weight="800" fill="#9a3412">4. "MERI FASAL" EXECUTION HUB</text>

    <!-- Delivery 1: Milestones Calendar -->
    <g transform="translate(14, 46)">
      <rect width="302" height="126" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
      <text x="14" y="26" font-size="12" font-weight="800" fill="#9a3412">📅 Milestones Action Calendar</text>
      <text x="14" y="50" font-size="10" font-weight="600" fill="#0f172a">• Crop-specific Day 0–120 sowing timeline</text>
      <text x="14" y="70" font-size="10" font-weight="600" fill="#0f172a">• Stage-wise NPK fertilizer &amp; irrigation dates</text>
      <text x="14" y="90" font-size="10" font-weight="600" fill="#0f172a">• Pest alerts &amp; voice guidance updates</text>
      <text x="14" y="110" font-size="9.5" font-weight="700" fill="#059669">✓ Synced to local agro-climatic zone</text>
    </g>

    <!-- Delivery 2: WhatsApp PDF Export -->
    <g transform="translate(14, 184)">
      <rect width="302" height="136" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
      <text x="14" y="26" font-size="12" font-weight="800" fill="#9a3412">📄 1-Click WhatsApp &amp; PDF Slip</text>
      <text x="14" y="50" font-size="10" font-weight="600" fill="#0f172a">• Official printable vector advisory slip</text>
      <text x="14" y="70" font-size="10" font-weight="600" fill="#0f172a">• 1-Tap instant share with family &amp; KVK officers</text>
      <text x="14" y="90" font-size="10" font-weight="600" fill="#0f172a">• Complete offline PWA field access</text>
      <rect x="14" y="102" width="220" height="22" rx="4" fill="#f0fdf4" stroke="#86efac"/>
      <text x="124" y="117" text-anchor="middle" font-size="9.5" font-weight="800" fill="#15803d">⚡ Zero-Network Field Ready</text>
    </g>
