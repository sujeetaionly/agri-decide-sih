        <rect width="146" height="42" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="73" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">🚜 Q6. Equipment</text>
      </g>
      <!-- Card 7 (Wide) -->
      <g transform="translate(0, 150)">
        <rect width="302" height="42" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
        <text x="151" y="26" text-anchor="middle" font-size="11.5" font-weight="800" fill="#be123c">💭 Q7. Thought Crop (Farmer Baseline)</text>
