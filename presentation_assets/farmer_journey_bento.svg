  <path d="M 346 650 C 362 650, 362 236, 368 236" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrPurple)"/>

  <!-- ==================== QUADRANT 3: TOP-RIGHT (AI Evaluation & What-If Studio) ==================== -->
  <g transform="translate(374, 66)" filter="url(#cardShadow)">
    <rect width="330" height="340" rx="12" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.8"/>
    <!-- Stage Header -->
    <rect width="330" height="34" rx="12" fill="#fae8ff"/>
    <rect y="22" width="330" height="12" fill="#fae8ff"/>
    <text x="16" y="22" font-size="12" font-weight="800" fill="#86198f">3. AI SIMULATION &amp; COMPARISON</text>

