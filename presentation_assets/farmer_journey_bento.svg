    <text x="273" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">🎙️ Voice Assisted</text>

    <!-- Compact Chips Grid (7 Agronomic Parameters) -->
    <g transform="translate(14, 46)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="146" height="42" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="73" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">📐 Q1. Farm Size</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(156, 0)">
        <rect width="146" height="42" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="73" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">🌱 Q2. Soil Type</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(0, 50)">
        <rect width="146" height="42" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="73" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">💧 Q3. Water Source</text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(156, 50)">
        <rect width="146" height="42" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="73" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">🔄 Q4. Previous Crop</text>
      </g>
      <!-- Card 5 -->
