        <rect width="146" height="42" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="73" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">📅 Q5. Sowing Date</text>
      </g>
      <!-- Card 6 -->
