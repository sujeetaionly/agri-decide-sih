  <!-- ==================== QUADRANT 1: TOP-LEFT (Vernacular Onboarding) ==================== -->
  <g transform="translate(16, 66)" filter="url(#cardShadow)">
    <rect width="330" height="290" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
    <!-- Stage Header -->
    <rect width="330" height="34" rx="12" fill="#dcfce7"/>
    <rect y="22" width="330" height="12" fill="#dcfce7"/>
    <text x="16" y="22" font-size="12" font-weight="800" fill="#166534">1. VERNACULAR ONBOARDING</text>

    <!-- Node 1: GPS -->
    <g transform="translate(14, 46)">
      <rect width="302" height="64" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <text x="24" y="38" font-size="20">📍</text>
      <text x="56" y="30" font-size="12" font-weight="800" fill="#0f172a">GPS Location Permission</text>
      <text x="56" y="48" font-size="10" font-weight="600" fill="#059669">Auto-detects district &amp; agro-climatic zone</text>
    </g>

    <!-- Arrow down -->
    <line x1="165" y1="110" x2="165" y2="122" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGreen)"/>

    <!-- Node 2: Regional Language -->
    <g transform="translate(14, 124)">
      <rect width="302" height="64" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <text x="24" y="38" font-size="20">🌐</text>
      <text x="56" y="30" font-size="12" font-weight="800" fill="#0f172a">Regional Language Selection</text>
      <text x="56" y="48" font-size="10" font-weight="600" fill="#059669">Auto-detect / Voice in Hindi, Marathi, etc.</text>
    </g>

    <!-- Arrow down -->
    <line x1="165" y1="188" x2="165" y2="200" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGreen)"/>

    <!-- Node 3: Mobile OTP -->
    <g transform="translate(14, 202)">
      <rect width="302" height="64" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <text x="24" y="38" font-size="20">🔐</text>
      <text x="56" y="30" font-size="12" font-weight="800" fill="#0f172a">Mobile No. &amp; OTP Login</text>
      <text x="56" y="48" font-size="10" font-weight="600" fill="#059669">Fast 1-tap rural phone authentication</text>
    </g>
  </g>

